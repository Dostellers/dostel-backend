mutation CreateBooking($bookingData: BookingInput!) {
  createBooking(input: $bookingData) {
    id
    reference
    status
    checkInDate
    checkOutDate
    totalAmount
    payment {
      status
      method
      transactionId
    }
  }
}

mutation ProcessPayment($bookingId: ID!, $paymentInput: PaymentInput!) {
  processPayment(id: $bookingId, input: $paymentInput) {
    id
    status
    payment {
      status
      transactionId
      amount
    }
  }
}
